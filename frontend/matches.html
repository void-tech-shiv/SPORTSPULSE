<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPORTSPULSE | Matches</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .match-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            transition: all var(--transition-speed) ease;
        }
        .match-card:hover {
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transform: translateY(-2px);
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }
        .match-status {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-completed { background: rgba(52, 199, 89, 0.15); color: #34c759; }
        .status-scheduled { background: rgba(0, 122, 255, 0.15); color: #0a84ff; }
        .status-ongoing { background: rgba(255, 149, 0, 0.15); color: #ff9f0a; }

        .match-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
        }
        .team-logo-small {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--text-primary);
        }
        .team-name {
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
        }
        .match-score {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-primary);
            padding: 0 1rem;
            white-space: nowrap;
        }
        .match-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }
        .match-venue {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .delete-match {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.4rem;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        .delete-match:hover {
            background: rgba(255, 59, 48, 0.1);
            color: var(--danger-color);
        }
    </style>
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <i data-lucide="activity"></i> SPORTS<span>PULSE</span>
        </div>
        <ul class="nav-links">
            <li><a href="/"><i data-lucide="layout-dashboard"></i> Overview</a></li>
            <li><a href="/players.html"><i data-lucide="users"></i> Players</a></li>
            <li><a href="/teams.html"><i data-lucide="shield-half"></i> Teams</a></li>
            <li><a href="/matches.html" class="active"><i data-lucide="swords"></i> Matches</a></li>
            <li><a href="/algorithms.html"><i data-lucide="cpu"></i> Algorithms</a></li>
            <li><a href="#"><i data-lucide="file-text"></i> Reports</a></li>
        </ul>
        <div class="sidebar-footer">
            <div class="system-status">
                <span class="status-indicator"></span> System Online
            </div>
            <div style="margin-top: 0.5rem; opacity: 0.5;">Version 2.0.1</div>
        </div>
    </nav>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Menu">
                    <i data-lucide="menu"></i>
                </button>
                <h1 class="page-title">Match Center</h1>
            </div>
            <div class="topbar-right">
                <div class="global-search">
                    <i data-lucide="search"></i>
                    <input type="text" id="global-search-input" placeholder="Search players, teams, matches...">
                    <div id="global-search-results"></div>
                </div>
                <div class="system-status">
                    <span class="status-indicator"></span> LIVE
                </div>
            </div>
        </header>

        <div class="content-area">
            <div class="section-header">
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <h2 class="section-title">Fixtures & Results</h2>
                    <div class="global-search" style="background: rgba(0,0,0,0.2);">
                        <i data-lucide="search"></i>
                        <input type="text" id="match-search" placeholder="Filter matches...">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="openAddMatchModal()">
                    <i data-lucide="plus"></i> Add Match
                </button>
            </div>

            <div class="matches-grid" id="matches-list">
                <!-- Skeleton loader -->
                <div class="match-card">
                    <div class="skeleton" style="height: 20px; width: 100%; margin-bottom: 1rem;"></div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <div class="skeleton" style="height: 40px; width: 40px; border-radius: 50%;"></div>
                        <div class="skeleton" style="height: 30px; width: 60px;"></div>
                        <div class="skeleton" style="height: 40px; width: 40px; border-radius: 50%;"></div>
                    </div>
                    <div class="skeleton" style="height: 20px; width: 100%;"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal for adding a match -->
    <div id="add-match-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Schedule Match</h2>
                <button class="modal-close" onclick="closeModals()"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <form id="add-match-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Match ID</label>
                            <input type="text" id="m-id" class="form-control" required placeholder="e.g. M101">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Competition ID</label>
                            <input type="text" id="m-comp" class="form-control" placeholder="e.g. C01">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; padding: 1rem; background: rgba(255,255,255,0.02); border-radius: 8px;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label">Team A ID</label>
                            <input type="text" id="m-team-a" class="form-control" required placeholder="e.g. T01">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label">Team B ID</label>
                            <input type="text" id="m-team-b" class="form-control" required placeholder="e.g. T02">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Date</label>
                            <input type="date" id="m-date" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Venue</label>
                            <input type="text" id="m-venue" class="form-control" placeholder="Stadium Name">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Score</label>
                            <input type="text" id="m-score" class="form-control" placeholder="e.g. 2-1">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Status</label>
                            <select id="m-status" class="form-control">
                                <option value="Scheduled">Scheduled</option>
                                <option value="Ongoing">Ongoing</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer" style="padding: 1.5rem 0 0 0; margin-top: 1rem;">
                        <button type="button" class="btn btn-outline" onclick="closeModals()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Match</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/matches.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
